<style>
/* Layout: sticky bar (back + ES/EN + category chips), hero, one band per category with its watercolour beside or below the list, allergen legend last. Single light look on purpose: the watercolours are painted on white paper. */
:root{
  --paper:#FFFFFF; --ink:#0B2238; --muted:#4A6178; --line:#D3DCE5; --band:#0A437C; --band-ink:#F2F5F8; --ember:#C8471E; --soft:#EEF3F8;
  --f-display:"Playfair Display",Georgia,"Times New Roman",serif;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gutr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--f-body);padding-left:0;padding-right:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:30}
.wrap{max-width:1000px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gutr)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ember);outline-offset:2px}

/* sticky bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;font-size:.9rem;padding:8px 2px;color:var(--band)}
.back:hover{text-decoration:underline}
.lang{display:inline-flex;border:1.5px solid var(--band);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:6px 14px;font-weight:700;font-size:.85rem;letter-spacing:.06em;color:var(--band)}
.lang button{display:inline-flex;align-items:center;gap:7px}
.lang button[aria-pressed="true"]{background:var(--band);color:#fff}
.fl{height:14px;flex:none;box-shadow:0 0 0 1px rgba(11,34,56,.25)}
.fl-es{width:21px}
.fl-uk{width:28px}
.lang button[aria-pressed="true"] .fl{box-shadow:0 0 0 1px rgba(255,255,255,.7)}
.cats{display:flex;gap:8px;overflow-x:auto;padding-block:2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:600;color:var(--muted);white-space:nowrap}
.cats button[aria-current="true"]{background:var(--band);border-color:var(--band);color:#fff}

/* hero */
.hero{text-align:center;padding-top:28px}
.eyebrow{margin:0;font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hero h1{margin:6px 0 0;font:700 clamp(2.4rem,9vw,3.6rem)/1.05 var(--f-display);color:var(--band);text-wrap:balance}
.hero .sub{margin:6px 0 0;font:italic 500 1.15rem/1.3 var(--f-display);color:var(--ink)}
.hero img{display:block;width:100%;max-width:640px;height:auto;margin:6px auto 0}

/* specials of the day */
.special{margin:8px 0 0;padding:16px 18px;border:2px solid var(--ember);border-radius:6px;background:#FFF6F1}
.special h2{margin:0 0 8px;font:700 1.2rem var(--f-display);color:var(--ember)}

/* sections */
.sec{padding-block:34px 8px;scroll-margin-top:118px}
.sec h2.band{display:inline-flex;align-items:center;gap:12px;margin:0 0 20px calc(-1 * var(--gut));padding:10px 28px 10px calc(var(--gut) + 2px);background:var(--band);color:var(--band-ink);font:600 clamp(1.3rem,5vw,1.8rem)/1.1 var(--f-display);letter-spacing:.12em;text-transform:uppercase}
.sec h2.band svg{width:26px;height:26px;flex:0 0 auto}
.sec .note{margin:-8px 0 16px;font:italic 500 .98rem var(--f-display);color:var(--muted)}
.body{display:grid;gap:20px}
.list{min-width:0}
figure{margin:0}
figure img{display:block;height:auto}
figure.wide img{width:100%}
figure.side img{margin-inline:auto;max-width:100%;max-height:320px;width:auto}
@media(min-width:820px){
  .body.side{grid-template-columns:minmax(0,1fr) 300px;gap:44px}
  .body.side.l{grid-template-columns:300px minmax(0,1fr)}
  .body.side.l figure{order:-1}
  figure.side{position:sticky;top:130px;align-self:start}
  figure.side img{width:100%;max-height:78vh;object-fit:contain;object-position:top center}
}
@media(max-width:819px){
  .body.side{position:relative}
  .body.side .list{position:relative;z-index:1}
  .body.side figure.side{position:absolute;top:0;bottom:0;width:50%;z-index:0;pointer-events:none;overflow:clip}
  .body.side.r figure.side{right:calc(-1 * var(--gut))}
  .body.side.l figure.side{left:calc(-1 * var(--gut))}
  .body.side figure.side img{position:sticky;top:112px;display:block;width:100%;height:auto;max-height:calc(100vh - 150px);max-width:none;margin:0;object-fit:contain;opacity:.3;mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(to var(--fade),transparent 0,#000 60%);mask-image:linear-gradient(to var(--fade),transparent 0,#000 60%)}
  .body.side.r figure.side img{--fade:right;object-position:right top}
  .body.side.l figure.side img{--fade:left;object-position:left top}
}
h3.sub{margin:26px 0 12px;font:italic 600 1.25rem var(--f-display);color:var(--band);padding-bottom:6px;border-bottom:1px solid var(--line)}
h3.sub:first-child{margin-top:0}
h4.grp{margin:22px 0 4px;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ember);font-weight:700}
ul.items{list-style:none;margin:0;padding:0;display:grid;gap:18px}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:start}
.nm{font:600 1.08rem/1.3 var(--f-display);color:var(--ink);text-wrap:balance}
.ds{margin:3px 0 0;font-size:.93rem;color:var(--muted)}
.opt{margin:3px 0 0;font-size:.93rem;color:var(--ink);font-weight:600}
.pr{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
.als{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.al{width:22px;height:22px;display:block}
.tbc{margin-top:7px;font-size:.8rem;font-weight:700;color:var(--ember)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.simple .it{align-items:baseline}
.simple .nm{font:600 1rem/1.3 var(--f-body)}
.simple .ds{display:inline}

/* allergens */
.legend{margin-top:48px;padding-block:34px 40px;background:var(--soft);border-top:1px solid var(--line)}
.legend h2{margin:0 0 6px;font:700 1.7rem var(--f-display);color:var(--band)}
.legend p{margin:0 0 22px;max-width:62ch;color:var(--muted)}
.lg{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px 16px}
.lg li{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.95rem}
.lg .al{width:34px;height:34px}
footer{padding-block:26px calc(30px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font-size:.9rem}
footer a{color:var(--band);font-weight:700}
</style>

/* ========= CÓDIGO ========= */
var lang='es',$=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function price(p){var f=p.toFixed(2);return lang==='es'?f.replace('.',','):f}
function ico(k,cls){var n=AL[k][lang==='es'?0:1];return '<svg class="'+cls+'" role="img" aria-label="'+n+'"><title>'+n+'</title><use href="#a-'+k+'"/></svg>'}
function item(it,simple){
  if(it.grp)return '<li><h4 class="grp">'+esc(it.grp[L()])+'</h4></li>';
  var h='<li class="it"><div class="tx"><span class="nm">'+esc(it.n[L()])+'</span>';
  if(it.d){var t=it.d[L()];h+= simple?'<span class="ds"> · '+esc(t)+'</span>':'<p class="ds">'+esc(t)+'</p>'}
  if(it.opt)it.opt.forEach(function(o){h+='<p class="opt">'+esc(o[L()])+' · '+price(o[2])+'</p>'});
  if(it.a.length)h+='<div class="als">'+it.a.map(function(k){return ico(k,'al')}).join('')+'</div>';
  if(it.tbc)h+='<div class="tbc">'+UI[lang].tbc+'</div>';
  return h+'</div><span class="pr">'+price(it.p)+'</span></li>'
}
function L(){return lang==='es'?0:1}
function list(items,simple){return '<ul class="items">'+items.map(function(i){return item(i,simple)}).join('')+'</ul>'}
function render(){
  var h='',c='';
  S.forEach(function(s){
    var f=s.fig,side=f[3]==='side',fig='<figure class="'+f[3]+'"><img src="img/'+f[0]+'.webp" width="'+f[1]+'" height="'+f[2]+'" alt="" loading="lazy" decoding="async"></figure>';
    var body=s.subs?s.subs.map(function(b){return '<h3 class="sub">'+esc(b.t[L()])+'</h3>'+list(b.items,s.simple)}).join(''):list(s.items,s.simple);
    h+='<section class="sec'+(s.simple?' simple':'')+'" id="'+s.id+'"><h2 class="band"><svg aria-hidden="true"><use href="#star"/></svg>'+esc(s.t[L()])+'</h2>'
      +(s.note?'<p class="note">'+esc(s.note[L()])+'</p>':'')
      +'<div class="body'+(side?' side '+f[4]:'')+'"><div class="list">'+body+'</div>'+fig+'</div></section>';
    c+='<button type="button" data-go="'+s.id+'">'+esc(s.t[L()])+'</button>'
  });
  $('menu').innerHTML=h;$('cats').innerHTML=c;$('cats').setAttribute('aria-label',UI[lang].cats);
  $('h1').textContent=UI[lang].h1;
  $('alh').textContent=UI[lang].alh;$('alp').textContent=UI[lang].alp;
  $('lg').innerHTML=Object.keys(AL).map(function(k){return '<li>'+ico(k,'al')+'<span>'+AL[k][L()]+'</span></li>'}).join('');
  document.querySelectorAll('[data-t="back"]').forEach(function(e){e.textContent=UI[lang].back});
  if(SPECIALS.length){$('specials-wrap').hidden=false;$('specials').innerHTML='<h2>'+UI[lang].spec+'</h2>'+list(SPECIALS)}
  $('l-es').setAttribute('aria-pressed',lang==='es');$('l-en').setAttribute('aria-pressed',lang==='en');
  document.documentElement.lang=lang;
  spy()
}
function setLang(l,keep){
  lang=l;try{localStorage.setItem('carta-lang',l)}catch(e){}
  try{history.replaceState(null,'','#'+l)}catch(e){}
  var y=window.scrollY;render();if(keep)window.scrollTo(0,y)
}
$('l-es').onclick=function(){setLang('es',1)};
$('l-en').onclick=function(){setLang('en',1)};
$('cats').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var s=$(b.getAttribute('data-go'));if(!s)return;
  var off=(document.querySelector('.top').offsetHeight||110)+8;
  var y=Math.max(0,s.getBoundingClientRect().top+window.pageYOffset-off);
  try{window.scrollTo(0,y)}catch(x){}
  setTimeout(function(){
    if(Math.abs(window.pageYOffset-y)>6){try{s.scrollIntoView(true)}catch(x){}}
    var y2=Math.max(0,s.getBoundingClientRect().top+window.pageYOffset-off);
    if(Math.abs(window.pageYOffset-y2)>6)try{window.scrollTo(0,y2)}catch(x){}
  },120);
  document.querySelectorAll('#cats button').forEach(function(c){if(c===b)c.setAttribute('aria-current','true');else c.removeAttribute('aria-current')})
});
var io=null;
function spy(){
  if(io)io.disconnect();
  if(!('IntersectionObserver' in window))return;
  io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting){
        document.querySelectorAll('#cats button').forEach(function(b){
          var on=b.getAttribute('data-go')===e.target.id;
          if(on){b.setAttribute('aria-current','true');var r=b.getBoundingClientRect(),n=$('cats').getBoundingClientRect();
            if(r.left<n.left+8||r.right>n.right-8)$('cats').scrollTo({left:b.offsetLeft-24,behavior:'smooth'})}
          else b.removeAttribute('aria-current')
        })
      }
    })
  },{rootMargin:'-130px 0px -65% 0px'});
  document.querySelectorAll('.sec').forEach(function(s){io.observe(s)})
}
(function(){
  var h=(location.hash||'').replace('#',''),l=null;
  if(h==='es'||h==='en')l=h;
  if(!l){try{l=localStorage.getItem('carta-lang')}catch(e){}}
  if(l!=='es'&&l!=='en'){var n=(navigator.language||'es').slice(0,2).toLowerCase();l=(n==='es'||n==='ca'||n==='it')?'es':'en'}
  lang=l;render()
})();
addEventListener('hashchange',function(){var h=location.hash.replace('#','');if((h==='es'||h==='en')&&h!==lang){lang=h;render()}});
</script>
